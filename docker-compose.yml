services:
  mysql:
    image: mysql:8.4
    container_name: ccms-mysql
    environment:
      MYSQL_DATABASE: ccms
      MYSQL_USER: ccms
      MYSQL_PASSWORD: ccms_dev_pw
      MYSQL_ROOT_PASSWORD: ccms_root_dev_pw
      TZ: Asia/Dhaka
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ccms-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uccms", "-pccms_dev_pw"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  ccms-mysql-data:

